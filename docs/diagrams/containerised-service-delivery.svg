<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 520">
  <title id="title">Containerised service delivery architecture</title>
  <desc id="desc">An HTTP caller reaches the FastAPI service. Startup configuration enters the service and structured logs leave through standard output. Source and tests pass through GitHub Actions quality gates, container build and scan, and a semantic-tag release to GHCR. The companion GitOps repository consumes the immutable image digest.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#0f172a} .box{fill:#f8fafc;stroke:#475569;stroke-width:2} .boundary{fill:#eef6ff;stroke:#2563eb;stroke-width:2} .arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)} .muted{fill:#475569;font-size:16px}</style>
  </defs>
  <rect width="1200" height="520" fill="#fff"/>
  <text x="600" y="38" text-anchor="middle" font-size="26" font-weight="700">Containerised service delivery architecture</text>
  <rect class="boundary" x="70" y="80" width="430" height="350" rx="14"/>
  <text x="285" y="113" text-anchor="middle" font-size="21" font-weight="700">Container runtime boundary</text>
  <rect class="box" x="145" y="175" width="280" height="78" rx="10"/><text x="285" y="205" text-anchor="middle" font-size="18" font-weight="700">FastAPI service</text><text x="285" y="230" text-anchor="middle" class="muted">Python 3.13 / Uvicorn</text>
  <rect class="box" x="95" y="300" width="160" height="68" rx="10"/><text x="175" y="326" text-anchor="middle" font-size="16" font-weight="700">Startup config</text><text x="175" y="349" text-anchor="middle" class="muted">allow-listed env</text>
  <rect class="box" x="310" y="300" width="160" height="68" rx="10"/><text x="390" y="326" text-anchor="middle" font-size="16" font-weight="700">JSON logs</text><text x="390" y="349" text-anchor="middle" class="muted">stdout</text>
  <text x="34" y="212" text-anchor="end" font-size="17">HTTP caller</text><path class="arrow" d="M42 212 H140"/><path class="arrow" d="M175 300 V255"/><path class="arrow" d="M425 214 H470 V300"/>
  <rect class="boundary" x="545" y="80" width="585" height="350" rx="14"/>
  <text x="837" y="113" text-anchor="middle" font-size="21" font-weight="700">GitHub Actions delivery boundary</text>
  <rect class="box" x="580" y="175" width="125" height="78" rx="10"/><text x="642" y="204" text-anchor="middle" font-size="15" font-weight="700">Source + tests</text><text x="642" y="229" text-anchor="middle" class="muted">metadata</text>
  <rect class="box" x="730" y="175" width="125" height="78" rx="10"/><text x="792" y="204" text-anchor="middle" font-size="15" font-weight="700">Quality gates</text><text x="792" y="229" text-anchor="middle" class="muted">lint · test</text>
  <rect class="box" x="880" y="175" width="125" height="78" rx="10"/><text x="942" y="204" text-anchor="middle" font-size="15" font-weight="700">Build + scan</text><text x="942" y="229" text-anchor="middle" class="muted">non-root · Trivy</text>
  <rect class="box" x="1030" y="175" width="75" height="78" rx="10"/><text x="1067" y="204" text-anchor="middle" font-size="15" font-weight="700">GHCR</text><text x="1067" y="229" text-anchor="middle" class="muted">digest</text>
  <path class="arrow" d="M705 214 H725"/><path class="arrow" d="M855 214 H875"/><path class="arrow" d="M1005 214 H1025"/>
  <rect class="box" x="705" y="315" width="280" height="68" rx="10"/><text x="845" y="341" text-anchor="middle" font-size="17" font-weight="700">Companion GitOps repository</text><text x="845" y="365" text-anchor="middle" class="muted">Kubernetes desired state consumes digest</text>
  <path class="arrow" d="M1067 255 V290 H985 V349"/>
  <text x="600" y="475" class="muted">No database, cloud API, secret store, or deployment action is part of this service repository.</text>
</svg>
