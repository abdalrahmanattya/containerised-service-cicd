name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Check formatting
        run: python -m ruff format --check src tests
      - name: Check lint
        run: python -m ruff check src tests
      - name: Run tests
        run: python -m pytest

  container:
    name: Container build and scan
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: docker build --tag containerised-service:ci .
      - name: Verify non-root runtime
        shell: bash
        run: test "$(docker run --rm --entrypoint id containerised-service:ci -u)" != 0
      - name: Scan image for high and critical vulnerabilities
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image
          --exit-code 1
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --no-progress
          containerised-service:ci
